name: RUDEL Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      - name: Restore Firebase configuration
        env:
          FIREBASE_CONFIG: ${{ secrets.RUDEL_FIREBASE_CONFIG }}
        run: |
          test -n "$FIREBASE_CONFIG"
          printf '%s' "$FIREBASE_CONFIG" > android-native/app/google-services.json

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore permanent signing
        env:
          KEYSTORE: ${{ secrets.RUDEL_KEYSTORE }}
        run: |
          mkdir -p "$HOME/.android"
          printf '%s' "$KEYSTORE" | base64 -d > "$HOME/.android/debug.keystore"

      - name: Build debug APK
        env:
          RUDEL_KEY_PASSWORD: ${{ secrets.RUDEL_KEY_PASSWORD }}
        working-directory: android-native
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RUDEL-Android-Debug
          path: android-native/app/build/outputs/apk/debug/*.apk
