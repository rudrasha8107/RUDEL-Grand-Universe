<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RUDEL</title><style>
*{box-sizing:border-box}body{--bg:#f5f5f8;--fg:#171820;--card:#fff;--muted:#676879;--accent:#6745ce;margin:0;background:var(--bg);color:var(--fg);font:15px system-ui,sans-serif}body.dark{--bg:#101116;--fg:#f4f4fa;--card:#202129;--muted:#aaaaba;--accent:#b39aff}header{display:flex;align-items:center;justify-content:space-between;padding:20px;position:sticky;top:0;background:var(--bg);z-index:2}header strong{font-size:25px;letter-spacing:-1px}button,a{font:inherit;color:inherit}button{border:0;cursor:pointer;background:var(--card);border-radius:14px;padding:13px}a{text-decoration:none}main{padding:0 20px 110px;max-width:700px;margin:auto;animation:enter .24s ease}h1{font-size:30px;letter-spacing:-1px;margin:12px 0}h2{font-size:19px;margin:24px 0 12px}p,small{color:var(--muted)}.hero{background:#27223e;color:white;border-radius:24px;padding:24px;min-height:150px}.hero p{color:#ddd5f6}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tile{display:block;background:var(--card);border-radius:20px;padding:20px;min-height:100px}.tile b{display:block;font-size:17px;margin:10px 0 4px}.tile span{font-size:24px}.line{display:flex;align-items:center;justify-content:space-between;background:var(--card);padding:17px;border-radius:14px;margin:8px 0;gap:10px}.nav{position:fixed;bottom:12px;left:12px;right:12px;display:flex;justify-content:space-around;background:#202128;color:white;border-radius:28px;padding:8px;z-index:4}.nav button{background:none;color:#c8c8d0;font-size:11px;padding:8px;min-width:48px}.nav button.active{background:#fff;color:#202128}.nav span{display:block;font-size:21px}input,textarea{width:100%;padding:13px;border:1px solid #8885;border-radius:12px;background:var(--card);color:var(--fg);font:inherit}textarea{min-height:120px}.primary{background:#6745ce;color:white}button:active,.tile:active{transform:scale(.97)}@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><header><strong>rudel<span style="color:var(--accent)">.</span></strong><button id="theme" aria-label="Change theme">◐</button></header><main id="main"></main><nav class="nav" id="nav"></nav><script>
const $=id=>document.getElementById(id), store=localStorage;const links={Friends:'rudel://connect',Messages:'rudel://connect',Stories:'rudel://connect','Rudra AI':'rudel://ai',Account:'rudel://account',Alarm:'rudel://alarm',Games:'playzone.html',Comics:'comicbook.html','Previous tools':'legacy-home.html'};const tabs=[['Home','⌂'],['Explore','◇'],['Tools','⊞'],['Profile','○']];let page='Home',timer=null;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function tile(n,i,d){return `<a class="tile" href="${links[n]||'#'+n}"><span>${i}</span><b>${n}</b><small>${d}</small></a>`}function show(n){clearInterval(timer);page=n;let h='';if(n==='Home')h=`<h1>Make today yours.</h1><p>Connect, create and discover.</p><section class="hero"><small style="color:#d5c9ff">YOUR SPACE</small><h2>Everything in one place.</h2><a href="rudel://connect">Open Connect →</a></section><h2>Quick access</h2><div class="grid">${tile('Friends','♧','Your circle')}${tile('Messages','▤','Private chats')}${tile('Rudra AI','✦','Ask a question')}${tile('Stories','◉','Your connections')}</div>`;else if(n==='Explore')h=`<h1>Explore</h1><p>Find something new to enjoy.</p><div class="grid">${tile('Games','♟','PlayZone')}${tile('Comics','▤','Reading library')}${tile('Stories','◉','Connect')}${tile('Previous tools','⊞','Existing features')}</div>`;else if(n==='Tools')h=`<h1>Your toolkit</h1><div class="grid">${tile('Alarm','◷','Phone clock')}${tile('Notes','▤','Private notes')}${tile('Tasks','✓','Daily checklist')}${tile('Stopwatch','◴','Track elapsed time')}${tile('Dashboard','▥','Your activity')}${tile('Timer','◷','Countdown')}</div>`;else if(n==='Profile')h=`<h1>My profile</h1><div class="hero"><h2>My RUDEL account</h2><a href="rudel://account">Manage account →</a></div><h2>Preferences</h2><a class="line" href="rudel://connect">Friends & messages <span>›</span></a><button class="line" onclick="toggleTheme()">Appearance ◐</button><a class="line" href="#About">About RUDEL <span>›</span></a>`;else if(n==='About')h='<h1>About RUDEL</h1><div class="tile"><small>FOUNDER & CREATOR</small><h2>Rudra Joshi</h2><p>RUDEL is a technology project created to bring connections, creativity, entertainment and useful digital tools together.</p><b>Rudra Joshi & Team</b></div>';else if(n==='Notes')h='<h1>Notes</h1><p>Saved privately on this device.</p><textarea id="note" placeholder="Write a note"></textarea><button class="primary" onclick="store.setItem('rudel.note', $('note').value);this.textContent='Saved'">Save note</button>';else if(n==='Tasks')h='<h1>Tasks</h1><form id="taskform"><input id="task" required maxlength="200" placeholder="New task"><button class="primary">Add task</button></form><div id="tasks"></div>';else if(n==='Dashboard')h=`<h1>Activity</h1><div class="grid"><div class="tile"><small>Tasks completed</small><h1>${tasks().filter(t=>t.done).length}</h1></div><div class="tile"><small>Total tasks</small><h1>${tasks().length}</h1></div></div><p>These are actual local task counts, not online statistics.</p>`;else if(n==='Timer'||n==='Stopwatch')h=`<h1>${n}</h1>${n==='Timer'?'<input id="minutes" type="number" min="1" max="180" value="5">':''}<h1 id="clock">00:00</h1><button class="primary" id="start">Start</button> <button id="reset">Reset</button><p>Runs while this screen is open. For background alarms use Alarm.</p>`;else return show('Home');$('main').innerHTML=h;$('nav').innerHTML=tabs.map(([t,i])=>`<button class="${n===t?'active':''}" onclick="location.hash='${t}'"><span>${i}</span>${t}</button>`).join('');if(n==='Notes')$('note').value=store.getItem('rudel.note')||'';if(n==='Tasks'){renderTasks();$('taskform').onsubmit=e=>{e.preventDefault();let a=tasks();a.push({text:$('task').value,done:false});save(a);$('task').value='';renderTasks()}}if(n==='Timer'||n==='Stopwatch'){$('start').onclick=()=>{clearInterval(timer);let end=Date.now()+(n==='Timer'?Math.max(1,Math.min(180,Number($('minutes').value)||5))*60000:0),tick=()=>{let v=Math.max(0,Math.floor((n==='Timer'?end-Date.now():Date.now()-end)/1000));$('clock').textContent=String(Math.floor(v/60)).padStart(2,'0')+':'+String(v%60).padStart(2,'0');if(n==='Timer'&&v===0){clearInterval(timer);$('clock').textContent='Time is up'}};tick();timer=setInterval(tick,200)};$('reset').onclick=()=>{clearInterval(timer);$('clock').textContent='00:00'}}}function tasks(){try{return JSON.parse(store.getItem('rudel.tasks')||'[]')}catch{return []}}function save(a){store.setItem('rudel.tasks',JSON.stringify(a))}function change(i,del){let a=tasks();if(del)a.splice(i,1);else a[i].done=!a[i].done;save(a);renderTasks()}function renderTasks(){$('tasks').innerHTML=tasks().map((t,i)=>`<div class="line"><button onclick="change(${i},false)">${t.done?'✓':'○'}</button><span>${esc(t.text)}</span><button onclick="change(${i},true)">×</button></div>`).join('')}function toggleTheme(){document.body.classList.toggle('dark');store.setItem('rudel.dark',document.body.classList.contains('dark')?'1':'0')}$('theme').onclick=toggleTheme;if(store.getItem('rudel.dark')==='1')document.body.classList.add('dark');window.onhashchange=()=>show(location.hash.slice(1)||'Home');show(location.hash.slice(1)||'Home');</script></body></html>
