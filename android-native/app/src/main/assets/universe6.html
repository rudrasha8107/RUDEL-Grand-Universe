<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RUDEL Universe</title><style>*{box-sizing:border-box}body{margin:0;background:#0a1020;color:#f4f6ff;font:16px system-ui;padding:22px}header{display:flex;align-items:center;gap:12px}img{width:44px}h1{font-size:32px;margin:12px 0}small,p{color:#b7c4df}section{background:linear-gradient(125deg,#243459,#392958);padding:24px;border-radius:28px;margin:24px 0}input{width:100%;padding:15px;border:1px solid #536483;border-radius:16px;background:#141e34;color:white;font:inherit}main{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}a{color:inherit;text-decoration:none;background:#18243b;border:1px solid #30415e;border-radius:20px;padding:16px;min-height:100px;display:block}a:active{transform:scale(.97)}a span{display:block;font-size:24px;margin-bottom:8px}h2{font-size:19px}footer{padding:24px 0;color:#aab8d4}@media(prefers-reduced-motion:no-preference){a{transition:transform .15s}}[hidden]{display:none!important}</style><header><img src="assets/icon-192.png" alt=""><b>RUDEL / UNIVERSE</b></header><section><small>YOUR SPACE · PRIVATE BY DEFAULT</small><h1>Make your world.</h1><p>Play, create and explore your universe.</p><a href="index.html">Open existing universe →</a></section><input id="search" placeholder="Search your universe" aria-label="Search"><h2>Explore worlds</h2><main id="cards"></main><footer>Rudel · Rudra Joshi and Team<br>Local experiences remain on your device.</footer><script>const items=[['🎮','Games arena','playzone.html'],['📚','Storyverse','comicbook.html'],['✦','Rudra assistant','rudra.html']];const cards=document.getElementById('cards');for(const [icon,name,url] of items){const a=document.createElement('a');a.href=url;const s=document.createElement('span');s.textContent=icon;a.append(s,document.createTextNode(name));cards.append(a)}document.getElementById('search').addEventListener('input',e=>{for(const a of cards.children)a.hidden=!a.textContent.toLowerCase().includes(e.target.value.toLowerCase())});</script></html>
