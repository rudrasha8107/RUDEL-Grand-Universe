plugins { id 'com.android.application'; id 'com.google.gms.google-services' }
android {
    signingConfigs {
        debug {
            storeFile file(System.getProperty("user.home") + "/.android/debug.keystore")
            storePassword System.getenv("RUDEL_KEY_PASSWORD") ?: "android"
            keyAlias "androiddebugkey"
            keyPassword System.getenv("RUDEL_KEY_PASSWORD") ?: "android"
        }
    }

    namespace 'com.rudel.reborn'
    compileSdk 35
    defaultConfig {
        applicationId 'com.rudel.grand'
        minSdk 29
        targetSdk 35
        versionCode 50
        versionName '5.0'
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation 'com.google.firebase:firebase-appcheck-playintegrity'

    implementation 'com.google.guava:guava:33.4.8-android'

    debugImplementation 'com.google.firebase:firebase-appcheck-debug'

    implementation platform('com.google.firebase:firebase-bom:34.6.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-ai'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-storage'
    implementation 'com.google.firebase:firebase-messaging'
}
